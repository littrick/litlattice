    expr: max(ALERTS{alertname="warning_repo-updater_repoupdater_errored_sync_jobs_percentage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_github_graphql_rate_limit_remaining
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 250 remaining calls to GitHub graphql
        API before hitting the rate limit'
      grafana_panel_id: "100120"
      level: warning
      name: github_graphql_rate_limit_remaining
      owner: source
      service_name: repo-updater
    expr: min((max by (name) (src_github_rate_limit_remaining_v2{resource="graphql"}))
      <= 250)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 250 remaining calls to GitHub graphql
