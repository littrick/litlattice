[package]
name = "sg-txemail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
# HMAC-MD5 for the CRAM-MD5 SMTP authentication mechanism.
md5 = { workspace = true }
# The html2text port reuses the library's exact regexes for tag/link/entity
# classification, so it keeps `regex` rather than hand-rolling them.
regex = { workspace = true }
# STARTTLS. See the workspace comment on the provider choice.
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `Email::bytes` formats the `Date` header in local time like Go's
# `time.Now().Format(time.RFC1123Z)`.
time = { workspace = true, features = ["local-offset"] }
