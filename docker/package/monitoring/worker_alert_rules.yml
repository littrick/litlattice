      description: 'worker: 30s+ 95th permissions sync duration for 5m0s'
      grafana_panel_id: "101260"
      level: warning
      name: perms_syncer_sync_duration
      owner: source
      service_name: worker
    expr: max((histogram_quantile(0.95, max by (le, type) (rate(src_repo_perms_syncer_sync_duration_seconds_bucket[1m]))))
      >= 30)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'worker: 30s+ 95th permissions sync duration for 5m0s'
      grafana_panel_id: "101260"
