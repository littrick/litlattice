[workspace]
resolver = "2"
members = [
    "crates/*/*",
    "bins/*",
    "xtask",
]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# base
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
regex = "1"
regex-syntax = "0.8"
sha2 = "0.10"
# tree-sitter grammars vendored from the exact parser sources used by the Go
# baseline (github.com/smacker/go-tree-sitter @ 233c2f923ac7). Published crate
# versions track different grammar commits, so runtimes must not be swapped.
tree-sitter = "=0.20.10"
tree-sitter-java = { path = "vendor/tree-sitter-java" }
tree-sitter-go = { path = "vendor/tree-sitter-go" }
tree-sitter-c-sharp = { path = "vendor/tree-sitter-c-sharp" }
tree-sitter-python = { path = "vendor/tree-sitter-python" }
tree-sitter-javascript = { path = "vendor/tree-sitter-javascript" }
tree-sitter-typescript = { path = "vendor/tree-sitter-typescript" }
tree-sitter-cpp = { path = "vendor/tree-sitter-cpp" }
tree-sitter-ruby = { path = "vendor/tree-sitter-ruby" }
bytes = "1"
flate2 = "1"
http = "1"
http-body-util = "0.1"
percent-encoding = "2"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
async-trait = "0.1"
tokio-stream = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
prometheus = "0.13"
opentelemetry = "0.24"
opentelemetry-otlp = "0.17"
tracing-opentelemetry = "0.25"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1

[profile.dev.package."*"]
opt-level = 1
