[package]
name = "tree-sitter-ruby"
description = "Ruby grammar for the tree-sitter parsing library (vendored)"
version = "0.19.0"
authors = [
    "Douglas Creager <dcreager@dcreager.net>",
    "Max Brunsfeld <maxbrunsfeld@gmail.com>",
]
license = "MIT"
readme = "bindings/rust/README.md"
keywords = ["incremental", "parsing", "ruby"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-ruby"
edition = "2018"
publish = false

# Vendored from tree-sitter-ruby v0.19.0 (grammar commit fe6a2d6), whose
# `src/parser.c` and `src/scanner.cc` are byte-identical to the grammars
# vendored by github.com/smacker/go-tree-sitter @ 233c2f923ac7, except for the
# `#include` line. The only change from the published crate is the
# `tree-sitter` dependency, widened from 0.19 to 0.20 so that the language can
# be used with the pinned `tree-sitter = 0.20.10` runtime (ABI version 13 is
# supported by both).
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "0.20.10"

[build-dependencies]
cc = "1.0"
