  - alert: critical_repo-updater_repo_updater_site_configuration_duration_since_last_successful_update_by_instance
    labels:
      alert_type: builtin
      description: 'repo-updater: 300s+ maximum duration since last successful site
        configuration update (all "repo_updater" instances)'
      grafana_panel_id: "101101"
      level: critical
      name: repo_updater_site_configuration_duration_since_last_successful_update_by_instance
      owner: infra-support
      service_name: repo-updater
    expr: max((max(max_over_time(src_conf_client_time_since_last_successful_update_seconds{job=~".*repo-updater"}[1m])))
      >= 300)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 300s+ maximum duration since last successful site
        configuration update (all "repo_updater" instances)'
      grafana_panel_id: "101101"
      level: critical
      name: repo_updater_site_configuration_duration_since_last_successful_update_by_instance
      owner: infra-support
      service_name: repo-updater
    expr: max(ALERTS{alertname="critical_repo-updater_repo_updater_site_configuration_duration_since_last_successful_update_by_instance",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'repo-updater: 0.1s+ mean blocked seconds per conn request for
        10m0s'
      grafana_panel_id: "101320"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: source
      service_name: repo-updater
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="repo-updater"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="repo-updater"}[5m])))
      >= 0.1)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 0.1s+ mean blocked seconds per conn request for
        10m0s'
      grafana_panel_id: "101320"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: source
