groups:
- name: zoekt
  rules:
  - alert: warning_zoekt_average_resolve_revision_duration
    labels:
      alert_type: builtin
      description: 'zoekt: 15s+ average resolve revision duration over 5m'
      grafana_panel_id: "100020"
      level: warning
      name: average_resolve_revision_duration
      owner: search-platform
      service_name: zoekt
    expr: max((sum(rate(resolve_revision_seconds_sum[5m])) / sum(rate(resolve_revision_seconds_count[5m])))
      >= 15)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'zoekt: 15s+ average resolve revision duration over 5m'
      grafana_panel_id: "100020"
      level: warning
      name: average_resolve_revision_duration
      owner: search-platform
      service_name: zoekt
    expr: max(ALERTS{alertname="warning_zoekt_average_resolve_revision_duration",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_zoekt_get_index_options_error_increase
    labels:
      alert_type: builtin
      description: 'zoekt: 100+ the number of repositories we failed to get indexing
        options over 5m for 5m0s'
      grafana_panel_id: "100021"
      level: warning
      name: get_index_options_error_increase
      owner: search-platform
      service_name: zoekt
    expr: max((sum(increase(get_index_options_error_total[5m]))) >= 100)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'zoekt: 100+ the number of repositories we failed to get indexing
        options over 5m for 5m0s'
      grafana_panel_id: "100021"
      level: warning
      name: get_index_options_error_increase
      owner: search-platform
      service_name: zoekt
    expr: max(ALERTS{alertname="warning_zoekt_get_index_options_error_increase",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_zoekt_get_index_options_error_increase
    labels:
      alert_type: builtin
      description: 'zoekt: 100+ the number of repositories we failed to get indexing
        options over 5m for 35m0s'
      grafana_panel_id: "100021"
      level: critical
      name: get_index_options_error_increase
      owner: search-platform
      service_name: zoekt
    expr: max((sum(increase(get_index_options_error_total[5m]))) >= 100)
    for: 35m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'zoekt: 100+ the number of repositories we failed to get indexing
        options over 5m for 35m0s'
      grafana_panel_id: "100021"
      level: critical
      name: get_index_options_error_increase
      owner: search-platform
      service_name: zoekt
    expr: max(ALERTS{alertname="critical_zoekt_get_index_options_error_increase",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_zoekt_indexed_search_request_errors
    labels:
      alert_type: builtin
      description: 'zoekt: 5%+ indexed search request errors every 5m by code for
        5m0s'
      grafana_panel_id: "100140"
      level: warning
      name: indexed_search_request_errors
      owner: search-platform
      service_name: zoekt
    expr: max((sum by (code) (increase(src_zoekt_request_duration_seconds_count{code!~"2.."}[5m]))
      / ignoring (code) group_left () sum(increase(src_zoekt_request_duration_seconds_count[5m]))
      * 100) >= 5)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'zoekt: 5%+ indexed search request errors every 5m by code for
        5m0s'
      grafana_panel_id: "100140"
      level: warning
      name: indexed_search_request_errors
      owner: search-platform
      service_name: zoekt
    expr: max(ALERTS{alertname="warning_zoekt_indexed_search_request_errors",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_zoekt_memory_map_areas_percentage_used
    labels:
      alert_type: builtin
      description: 'zoekt: 60%+ process memory map areas percentage used (per instance)'
      grafana_panel_id: "100500"
      level: warning
      name: memory_map_areas_percentage_used
      owner: search-platform
      service_name: zoekt
    expr: max(((proc_metrics_memory_map_current_count / proc_metrics_memory_map_max_limit)
      * 100) >= 60)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'zoekt: 60%+ process memory map areas percentage used (per instance)'
