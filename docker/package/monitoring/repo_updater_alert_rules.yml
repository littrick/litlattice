groups:
- name: repo-updater
  rules:
  - alert: critical_repo-updater_src_repoupdater_max_sync_backoff
    labels:
      alert_type: builtin
      description: 'repo-updater: 32400s+ time since oldest sync for 10m0s'
      grafana_panel_id: "100001"
      level: critical
      name: src_repoupdater_max_sync_backoff
      owner: source
      service_name: repo-updater
    expr: max((max(src_repoupdater_max_sync_backoff)) >= 32400)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 32400s+ time since oldest sync for 10m0s'
      grafana_panel_id: "100001"
      level: critical
      name: src_repoupdater_max_sync_backoff
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="critical_repo-updater_src_repoupdater_max_sync_backoff",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_src_repoupdater_syncer_sync_errors_total
    labels:
      alert_type: builtin
      description: 'repo-updater: 0.5+ site level external service sync error rate
        for 10m0s'
      grafana_panel_id: "100002"
      level: warning
      name: src_repoupdater_syncer_sync_errors_total
      owner: source
      service_name: repo-updater
    expr: max((max by (family) (rate(src_repoupdater_syncer_sync_errors_total{owner!="user",reason!="internal_rate_limit",reason!="invalid_npm_path"}[5m])))
      > 0.5)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 0.5+ site level external service sync error rate
        for 10m0s'
      grafana_panel_id: "100002"
      level: warning
      name: src_repoupdater_syncer_sync_errors_total
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_src_repoupdater_syncer_sync_errors_total",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_repo-updater_src_repoupdater_syncer_sync_errors_total
    labels:
      alert_type: builtin
      description: 'repo-updater: 1+ site level external service sync error rate for
        10m0s'
      grafana_panel_id: "100002"
      level: critical
      name: src_repoupdater_syncer_sync_errors_total
      owner: source
      service_name: repo-updater
    expr: max((max by (family) (rate(src_repoupdater_syncer_sync_errors_total{owner!="user",reason!="internal_rate_limit",reason!="invalid_npm_path"}[5m])))
      > 1)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 1+ site level external service sync error rate for
        10m0s'
      grafana_panel_id: "100002"
      level: critical
      name: src_repoupdater_syncer_sync_errors_total
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="critical_repo-updater_src_repoupdater_syncer_sync_errors_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_syncer_sync_start
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repo metadata sync was started for 9h0m0s'
      grafana_panel_id: "100010"
      level: warning
      name: syncer_sync_start
      owner: source
      service_name: repo-updater
    expr: min((max by (family) (rate(src_repoupdater_syncer_start_sync{family="Syncer.SyncExternalService"}[9h])))
      <= 0)
    for: 9h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repo metadata sync was started for 9h0m0s'
      grafana_panel_id: "100010"
      level: warning
      name: syncer_sync_start
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_syncer_sync_start",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_syncer_sync_duration
    labels:
      alert_type: builtin
      description: 'repo-updater: 30s+ 95th repositories sync duration for 5m0s'
      grafana_panel_id: "100011"
      level: warning
      name: syncer_sync_duration
      owner: source
      service_name: repo-updater
    expr: max((histogram_quantile(0.95, max by (le, family, success) (rate(src_repoupdater_syncer_sync_duration_seconds_bucket[1m]))))
      >= 30)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 30s+ 95th repositories sync duration for 5m0s'
      grafana_panel_id: "100011"
      level: warning
      name: syncer_sync_duration
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_syncer_sync_duration",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_source_duration
    labels:
      alert_type: builtin
      description: 'repo-updater: 30s+ 95th repositories source duration for 5m0s'
      grafana_panel_id: "100012"
      level: warning
      name: source_duration
      owner: source
      service_name: repo-updater
    expr: max((histogram_quantile(0.95, max by (le) (rate(src_repoupdater_source_duration_seconds_bucket[1m]))))
      >= 30)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 30s+ 95th repositories source duration for 5m0s'
      grafana_panel_id: "100012"
      level: warning
      name: source_duration
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_source_duration",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_syncer_synced_repos
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repositories synced for 9h0m0s'
      grafana_panel_id: "100020"
      level: warning
      name: syncer_synced_repos
      owner: source
      service_name: repo-updater
    expr: max((max(rate(src_repoupdater_syncer_synced_repos_total[1m]))) <= 0)
    for: 9h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repositories synced for 9h0m0s'
      grafana_panel_id: "100020"
      level: warning
      name: syncer_synced_repos
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_syncer_synced_repos",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_sourced_repos
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repositories sourced for 9h0m0s'
      grafana_panel_id: "100021"
      level: warning
      name: sourced_repos
      owner: source
      service_name: repo-updater
    expr: min((max(rate(src_repoupdater_source_repos_total[1m]))) <= 0)
    for: 9h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repositories sourced for 9h0m0s'
      grafana_panel_id: "100021"
      level: warning
      name: sourced_repos
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_sourced_repos",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_purge_failed
    labels:
      alert_type: builtin
      description: 'repo-updater: 0+ repositories purge failed for 5m0s'
      grafana_panel_id: "100030"
      level: warning
      name: purge_failed
      owner: source
      service_name: repo-updater
    expr: max((max(rate(src_repoupdater_purge_failed[1m]))) > 0)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 0+ repositories purge failed for 5m0s'
      grafana_panel_id: "100030"
      level: warning
      name: purge_failed
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_purge_failed",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_sched_auto_fetch
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repositories scheduled due to hitting
        a deadline for 9h0m0s'
      grafana_panel_id: "100040"
      level: warning
      name: sched_auto_fetch
      owner: source
      service_name: repo-updater
    expr: min((max(rate(src_repoupdater_sched_auto_fetch[1m]))) <= 0)
    for: 9h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repositories scheduled due to hitting
        a deadline for 9h0m0s'
      grafana_panel_id: "100040"
      level: warning
      name: sched_auto_fetch
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_sched_auto_fetch",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_sched_known_repos
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repositories managed by the scheduler
        for 10m0s'
      grafana_panel_id: "100050"
      level: warning
      name: sched_known_repos
      owner: source
      service_name: repo-updater
    expr: min((max(src_repoupdater_sched_known_repos)) <= 0)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 repositories managed by the scheduler
        for 10m0s'
      grafana_panel_id: "100050"
      level: warning
      name: sched_known_repos
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_sched_known_repos",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_repo-updater_sched_update_queue_length
    labels:
      alert_type: builtin
      description: 'repo-updater: 0+ rate of growth of update queue length over 5
        minutes for 2h0m0s'
      grafana_panel_id: "100051"
      level: critical
      name: sched_update_queue_length
      owner: source
      service_name: repo-updater
    expr: max((max(deriv(src_repoupdater_sched_update_queue_length[5m]))) > 0)
    for: 2h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 0+ rate of growth of update queue length over 5
        minutes for 2h0m0s'
      grafana_panel_id: "100051"
      level: critical
      name: sched_update_queue_length
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="critical_repo-updater_sched_update_queue_length",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_sched_loops
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 scheduler loops for 9h0m0s'
      grafana_panel_id: "100052"
      level: warning
      name: sched_loops
      owner: source
      service_name: repo-updater
    expr: min((max(rate(src_repoupdater_sched_loops[1m]))) <= 0)
    for: 9h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: less than 0 scheduler loops for 9h0m0s'
      grafana_panel_id: "100052"
      level: warning
      name: sched_loops
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_sched_loops",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_src_repoupdater_stale_repos
    labels:
      alert_type: builtin
      description: 'repo-updater: 1+ repos that haven''t been fetched in more than
        8 hours for 25m0s'
      grafana_panel_id: "100060"
      level: warning
      name: src_repoupdater_stale_repos
      owner: source
      service_name: repo-updater
    expr: max((max(src_repoupdater_stale_repos)) >= 1)
    for: 25m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 1+ repos that haven''t been fetched in more than
        8 hours for 25m0s'
      grafana_panel_id: "100060"
      level: warning
      name: src_repoupdater_stale_repos
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_src_repoupdater_stale_repos",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_repo-updater_sched_error
    labels:
      alert_type: builtin
      description: 'repo-updater: 1+ repositories schedule error rate for 25m0s'
      grafana_panel_id: "100061"
      level: critical
      name: sched_error
      owner: source
      service_name: repo-updater
    expr: max((max(rate(src_repoupdater_sched_error[1m]))) >= 1)
    for: 25m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 1+ repositories schedule error rate for 25m0s'
      grafana_panel_id: "100061"
      level: critical
      name: sched_error
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="critical_repo-updater_sched_error",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_repo-updater_src_repoupdater_external_services_total
    labels:
      alert_type: builtin
      description: 'repo-updater: 20000+ the total number of external services for
        1h0m0s'
      grafana_panel_id: "100100"
      level: critical
      name: src_repoupdater_external_services_total
      owner: source
      service_name: repo-updater
    expr: max((max(src_repoupdater_external_services_total)) >= 20000)
    for: 1h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 20000+ the total number of external services for
        1h0m0s'
      grafana_panel_id: "100100"
      level: critical
      name: src_repoupdater_external_services_total
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="critical_repo-updater_src_repoupdater_external_services_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_repoupdater_queued_sync_jobs_total
    labels:
      alert_type: builtin
      description: 'repo-updater: 100+ the total number of queued sync jobs for 1h0m0s'
      grafana_panel_id: "100110"
      level: warning
      name: repoupdater_queued_sync_jobs_total
      owner: source
      service_name: repo-updater
    expr: max((max(src_repoupdater_queued_sync_jobs_total)) >= 100)
    for: 1h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 100+ the total number of queued sync jobs for 1h0m0s'
      grafana_panel_id: "100110"
      level: warning
      name: repoupdater_queued_sync_jobs_total
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_repoupdater_queued_sync_jobs_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_repoupdater_completed_sync_jobs_total
    labels:
      alert_type: builtin
      description: 'repo-updater: 100000+ the total number of completed sync jobs
        for 1h0m0s'
      grafana_panel_id: "100111"
      level: warning
      name: repoupdater_completed_sync_jobs_total
      owner: source
      service_name: repo-updater
    expr: max((max(src_repoupdater_completed_sync_jobs_total)) >= 100000)
    for: 1h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 100000+ the total number of completed sync jobs
        for 1h0m0s'
      grafana_panel_id: "100111"
      level: warning
      name: repoupdater_completed_sync_jobs_total
      owner: source
      service_name: repo-updater
    expr: max(ALERTS{alertname="warning_repo-updater_repoupdater_completed_sync_jobs_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_repo-updater_repoupdater_errored_sync_jobs_percentage
    labels:
      alert_type: builtin
      description: 'repo-updater: 10%+ the percentage of external services that have
        failed their most recent sync for 1h0m0s'
      grafana_panel_id: "100112"
      level: warning
      name: repoupdater_errored_sync_jobs_percentage
      owner: source
      service_name: repo-updater
    expr: max((max(src_repoupdater_errored_sync_jobs_percentage)) > 10)
    for: 1h
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'repo-updater: 10%+ the percentage of external services that have
        failed their most recent sync for 1h0m0s'
