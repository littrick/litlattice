  - alert: warning_worker_insights_queue_unutilized_size
    labels:
      alert_type: builtin
      description: 'worker: 0+ insights queue size that is not utilized (not processing)
        for 30m0s'
      grafana_panel_id: "102800"
      level: warning
      name: insights_queue_unutilized_size
      owner: code-search
      service_name: worker
    expr: max((max(src_query_runner_worker_total{job=~"^worker.*"}) > 0 and on (job)
      sum by (op) (increase(src_workerutil_dbworker_store_insights_query_runner_jobs_store_total{job=~"^worker.*",op="Dequeue"}[5m]))
      < 1) > 0)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'worker: 0+ insights queue size that is not utilized (not processing)
        for 30m0s'
