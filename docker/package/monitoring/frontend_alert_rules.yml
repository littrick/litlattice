groups:
- name: frontend
  rules:
  - alert: warning_frontend_99th_percentile_search_request_duration
    labels:
      alert_type: builtin
      description: 'frontend: 20s+ 99th percentile successful search request duration
        over 5m'
      grafana_panel_id: "100000"
      level: warning
      name: 99th_percentile_search_request_duration
      owner: code-search
      service_name: frontend
    expr: max((histogram_quantile(0.99, sum by (le) (rate(src_search_streaming_latency_seconds_bucket{source="browser"}[5m]))))
      >= 20)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'frontend: 20s+ 99th percentile successful search request duration
        over 5m'
      grafana_panel_id: "100000"
      level: warning
      name: 99th_percentile_search_request_duration
      owner: code-search
      service_name: frontend
    expr: max(ALERTS{alertname="warning_frontend_99th_percentile_search_request_duration",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_frontend_90th_percentile_search_request_duration
    labels:
      alert_type: builtin
      description: 'frontend: 15s+ 90th percentile successful search request duration
        over 5m'
      grafana_panel_id: "100001"
      level: warning
      name: 90th_percentile_search_request_duration
      owner: code-search
      service_name: frontend
    expr: max((histogram_quantile(0.9, sum by (le) (rate(src_search_streaming_latency_seconds_bucket{source="browser"}[5m]))))
      >= 15)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'frontend: 15s+ 90th percentile successful search request duration
        over 5m'
      grafana_panel_id: "100001"
      level: warning
      name: 90th_percentile_search_request_duration
      owner: code-search
      service_name: frontend
    expr: max(ALERTS{alertname="warning_frontend_90th_percentile_search_request_duration",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_frontend_hard_timeout_search_responses
    labels:
      alert_type: builtin
      description: 'frontend: 2%+ hard timeout search responses every 5m for 15m0s'
      grafana_panel_id: "100010"
      level: warning
      name: hard_timeout_search_responses
      owner: code-search
      service_name: frontend
    expr: max(((sum(increase(src_graphql_search_response{request_name!="CodeIntelSearch",source="browser",status="timeout"}[5m]))
      + sum(increase(src_graphql_search_response{alert_type="timed_out",request_name!="CodeIntelSearch",source="browser",status="alert"}[5m])))
      / sum(increase(src_graphql_search_response{request_name!="CodeIntelSearch",source="browser"}[5m]))
      * 100) >= 2)
    for: 15m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'frontend: 2%+ hard timeout search responses every 5m for 15m0s'
      grafana_panel_id: "100010"
      level: warning
      name: hard_timeout_search_responses
      owner: code-search
      service_name: frontend
    expr: max(ALERTS{alertname="warning_frontend_hard_timeout_search_responses",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_frontend_hard_error_search_responses
    labels:
      alert_type: builtin
      description: 'frontend: 2%+ hard error search responses every 5m for 15m0s'
      grafana_panel_id: "100011"
      level: warning
      name: hard_error_search_responses
      owner: code-search
      service_name: frontend
    expr: max((sum by (status) (increase(src_graphql_search_response{request_name!="CodeIntelSearch",source="browser",status=~"error"}[5m]))
      / ignoring (status) group_left () sum(increase(src_graphql_search_response{request_name!="CodeIntelSearch",source="browser"}[5m]))
      * 100) >= 2)
    for: 15m
  - record: alert_count
