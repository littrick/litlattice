name: release-docker

# Build rootfs + Docker image through the reusable package workflow
# (`package.yml`), then publish the Docker image archive as a GitHub Release
# asset on this repository. The rootfs tarball is only kept as a run artifact.
#
# Trigger it by hand. The release tag is always auto-generated as
# `v<SOURCEGRAPH_VERSION>-<UTC date>.N` (same-day runs increment N) and is
# created at the built commit.
#
# Release assets are capped at 2 GiB per file, and `docker save` output is
# uncompressed, so the archive is gzipped for the release by default.
# `docker load -i <file>.tar.gz` accepts it directly.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false
      observability:
        description: "Build the observability feature (adds -observability to the image name)"
        type: boolean
        default: false
      sveltekit:
        description: "Build and ship the SvelteKit web UI (_sk)"
        type: boolean
        default: false
      sourcemaps:
        description: "Keep *.map files in /assets-dist"
        type: boolean
        default: false
      image_tag:
        description: "Optional Docker image name:tag (default: litlattice:<auto-generated tag>)"
        type: string
        default: ""
      runner:
        description: "Runner label used for the build (use a larger/self-hosted runner for release builds)"
        type: string
        default: "ubuntu-latest"
      compress:
        description: "Gzip the Docker archive for the release asset (GitHub caps release assets at 2 GiB)"
        type: boolean
        default: true

# The release step needs to create tags/releases; the package job is granted
# read-only access explicitly below.
permissions:
  contents: write

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve the auto-generated tag before the (expensive) package job so the
  # tag is fixed once and passed to both jobs.
  validate:
    name: Resolve release tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      # Only needed to list existing tags for the same-day counter.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release tag
        id: tag
        run: |
          set -euo pipefail
          # v<SOURCEGRAPH_VERSION>-<UTC date>.N, where N is one past the
          # highest same-day counter already tagged in the repository.
          . docker/package/versions.env
          today=$(date -u +%Y%m%d)
          prefix="v${SOURCEGRAPH_VERSION}-${today}"
          escaped=${prefix//./\\.}
          escaped=${escaped//+/\\+}
          max=$(git tag -l "${prefix}.*" \
            | sed -nE "s/^${escaped}\.([0-9]+)$/\1/p" \
            | sort -n | tail -1)
          TAG="${prefix}.$(( ${max:-0} + 1 ))"
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::generated release tag '$TAG' is malformed"
            exit 1
          fi
          # Docker tags only allow [A-Za-z0-9_.-]; `+` is valid in a git tag
          # but not in an image tag.
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "image_tag=litlattice:${TAG//+/-}" >>"$GITHUB_OUTPUT"
          echo "release tag: $TAG"

  package:
    name: Package rootfs + Docker image
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
    with:
      observability: ${{ inputs.observability || false }}
      sveltekit: ${{ inputs.sveltekit || false }}
      sourcemaps: ${{ inputs.sourcemaps || false }}
      docker_image: true
      image_tag: ${{ inputs.image_tag || needs.validate.outputs.image_tag }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      retention_days: "7"

  release:
    name: Publish Docker image release
    needs: [validate, package]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      COMPRESS: ${{ inputs.compress }}
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.run_id }}
          path: dist

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          # Verify the archive against the checksum written by package.sh
          # before publishing anything.
          shopt -s nullglob
          sums=(dist/*.docker.tar.sha256)
          if [ "${#sums[@]}" -eq 0 ]; then
            echo "::error::no *.docker.tar.sha256 in the docker-image artifact"
            exit 1
          fi
          for sum in "${sums[@]}"; do
            ( cd dist && sha256sum -c "$(basename "$sum")" )
          done
          ls -lh dist

      - name: Prepare release assets
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          for tar in dist/*.docker.tar; do
            base="$(basename "$tar")"
            if [ "$COMPRESS" = "true" ]; then
              # gzip keeps the asset under GitHub's 2 GiB per-file limit;
              # `docker load -i` reads gzip-compressed archives.
              gzip -6 -c "$tar" >"dist/$base.gz"
              ( cd dist && sha256sum "$base.gz" >"$base.gz.sha256" )
              rm -f "$tar" "dist/$base.sha256"
              assets+=("dist/$base.gz")
              assets+=("dist/$base.gz.sha256")
            else
              assets+=("$tar")
              [ -f "dist/$base.sha256" ] && assets+=("dist/$base.sha256")
            fi
          done
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::the docker-image artifact contains no *.docker.tar"
            exit 1
          fi
          ls -lh dist
          {
            echo "files<<__EOF__"
            printf '%s\n' "${assets[@]}"
            echo "__EOF__"
          } >>"$GITHUB_OUTPUT"

      # Creates the release (tag at the packaged commit when it does not exist
      # yet) and uploads the assets; re-runs overwrite the same asset names and
      # refresh the draft/prerelease flags, matching the previous `gh`
      # implementation.
      - name: Publish release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: ${{ steps.assets.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Write summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Docker release"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- URL: ${{ steps.release.outputs.url }}"
            echo "- Compressed asset: \`$COMPRESS\`"
            echo
            echo "| file | size |"
            echo "| --- | --- |"
            if [ -d dist ]; then
              find dist -maxdepth 1 -type f -printf '| %f | %s bytes |\n' | sort
            fi
          } >>"$GITHUB_STEP_SUMMARY"
