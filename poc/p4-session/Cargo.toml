[package]
name = "p4-session"
version = "0.1.0"
edition = "2021"
publish = false

# Independent workspace: PoCs are not part of the production build.
[workspace]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "0.27", features = ["tokio-comp"] }
tokio = { version = "1", features = ["rt", "macros"] }
