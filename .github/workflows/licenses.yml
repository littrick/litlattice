name: licenses

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dependency licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
