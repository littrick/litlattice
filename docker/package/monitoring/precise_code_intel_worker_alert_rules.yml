groups:
- name: precise-code-intel-worker
  rules:
  - alert: warning_precise-code-intel-worker_codeintel_upload_queued_max_age
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 18000s+ unprocessed upload record queue
        longest time in queue'
      grafana_panel_id: "100002"
      level: warning
      name: codeintel_upload_queued_max_age
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((max(src_codeintel_upload_queued_duration_seconds_total{job=~"^precise-code-intel-worker.*"}))
      >= 18000)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 18000s+ unprocessed upload record queue
        longest time in queue'
      grafana_panel_id: "100002"
      level: warning
      name: codeintel_upload_queued_max_age
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_codeintel_upload_queued_max_age",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 0.1s+ mean blocked seconds per conn
        request for 10m0s'
      grafana_panel_id: "100720"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: precise-code-intel-worker
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="precise-code-intel-worker"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="precise-code-intel-worker"}[5m])))
      >= 0.1)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 0.1s+ mean blocked seconds per conn
        request for 10m0s'
      grafana_panel_id: "100720"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_mean_blocked_seconds_per_conn_request",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_precise-code-intel-worker_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 0.5s+ mean blocked seconds per conn
        request for 10m0s'
      grafana_panel_id: "100720"
      level: critical
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: precise-code-intel-worker
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="precise-code-intel-worker"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="precise-code-intel-worker"}[5m])))
      >= 0.5)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 0.5s+ mean blocked seconds per conn
        request for 10m0s'
      grafana_panel_id: "100720"
      level: critical
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="critical_precise-code-intel-worker_mean_blocked_seconds_per_conn_request",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_container_cpu_usage
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 99%+ container cpu usage total (1m
        average) across all cores by instance'
      grafana_panel_id: "100801"
      level: warning
      name: container_cpu_usage
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((cadvisor_container_cpu_usage_percentage_total{name=~"^precise-code-intel-worker.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 99%+ container cpu usage total (1m
        average) across all cores by instance'
      grafana_panel_id: "100801"
      level: warning
      name: container_cpu_usage
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_container_cpu_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_container_memory_usage
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 99%+ container memory usage by instance'
      grafana_panel_id: "100802"
      level: warning
      name: container_memory_usage
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((cadvisor_container_memory_usage_percentage_total{name=~"^precise-code-intel-worker.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 99%+ container memory usage by instance'
      grafana_panel_id: "100802"
      level: warning
      name: container_memory_usage
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_container_memory_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_provisioning_container_cpu_usage_long_term
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 80%+ container cpu usage total (90th
        percentile over 1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "100900"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((quantile_over_time(0.9, cadvisor_container_cpu_usage_percentage_total{name=~"^precise-code-intel-worker.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 80%+ container cpu usage total (90th
        percentile over 1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "100900"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_provisioning_container_cpu_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_provisioning_container_memory_usage_long_term
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 80%+ container memory usage (1d maximum)
        by instance for 336h0m0s'
      grafana_panel_id: "100901"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^precise-code-intel-worker.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 80%+ container memory usage (1d maximum)
        by instance for 336h0m0s'
      grafana_panel_id: "100901"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_provisioning_container_memory_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_provisioning_container_cpu_usage_short_term
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 90%+ container cpu usage total (5m
        maximum) across all cores by instance for 30m0s'
      grafana_panel_id: "100910"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((max_over_time(cadvisor_container_cpu_usage_percentage_total{name=~"^precise-code-intel-worker.*"}[5m]))
      >= 90)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 90%+ container cpu usage total (5m
        maximum) across all cores by instance for 30m0s'
      grafana_panel_id: "100910"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_provisioning_container_cpu_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_provisioning_container_memory_usage_short_term
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 90%+ container memory usage (5m maximum)
        by instance'
      grafana_panel_id: "100911"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^precise-code-intel-worker.*"}[5m]))
      >= 90)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 90%+ container memory usage (5m maximum)
        by instance'
      grafana_panel_id: "100911"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_provisioning_container_memory_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_container_oomkill_events_total
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 1+ container OOMKILL events total by
        instance'
      grafana_panel_id: "100912"
      level: warning
      name: container_oomkill_events_total
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((max by (name) (container_oom_events_total{name=~"^precise-code-intel-worker.*"}))
      >= 1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 1+ container OOMKILL events total by
        instance'
      grafana_panel_id: "100912"
      level: warning
      name: container_oomkill_events_total
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_container_oomkill_events_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_go_goroutines
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 10000+ maximum active goroutines for
        10m0s'
      grafana_panel_id: "101000"
      level: warning
      name: go_goroutines
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((max by (instance) (go_goroutines{job=~".*precise-code-intel-worker"}))
      >= 10000)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 10000+ maximum active goroutines for
        10m0s'
      grafana_panel_id: "101000"
      level: warning
      name: go_goroutines
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_go_goroutines",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_precise-code-intel-worker_go_gc_duration_seconds
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 2s+ maximum go garbage collection duration'
      grafana_panel_id: "101001"
      level: warning
      name: go_gc_duration_seconds
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max((max by (instance) (go_gc_duration_seconds{job=~".*precise-code-intel-worker"}))
      >= 2)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: 2s+ maximum go garbage collection duration'
      grafana_panel_id: "101001"
      level: warning
      name: go_gc_duration_seconds
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="warning_precise-code-intel-worker_go_gc_duration_seconds",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_precise-code-intel-worker_pods_available_percentage
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: less than 90% percentage pods available
        for 10m0s'
      grafana_panel_id: "101100"
      level: critical
      name: pods_available_percentage
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: min((sum by (app) (up{app=~".*precise-code-intel-worker"}) / count by (app)
      (up{app=~".*precise-code-intel-worker"}) * 100) <= 90)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'precise-code-intel-worker: less than 90% percentage pods available
        for 10m0s'
      grafana_panel_id: "101100"
      level: critical
      name: pods_available_percentage
      owner: code-intel
      service_name: precise-code-intel-worker
    expr: max(ALERTS{alertname="critical_precise-code-intel-worker_pods_available_percentage",alertstate="firing"}
      OR on() vector(0))
  interval: 30s
