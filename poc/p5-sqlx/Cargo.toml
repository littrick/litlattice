[package]
name = "p5-sqlx"
version = "0.1.0"
edition = "2021"
publish = false

# Independent workspace: PoCs are not part of the production build.
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "json",
    "bigdecimal",
] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = "0.4"
