groups:
- name: postgres
  rules:
  - alert: warning_postgres_connections
    labels:
      alert_type: builtin
      description: 'postgres: less than 5 active connections for 5m0s'
      grafana_panel_id: "100000"
      level: warning
      name: connections
      owner: infra-support
      service_name: postgres
    expr: min((sum by (job) (pg_stat_activity_count{datname!~"template.*|postgres|cloudsqladmin"})
      or sum by (job) (pg_stat_activity_count{datname!~"template.*|cloudsqladmin",job="codeinsights-db"}))
      <= 5)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: less than 5 active connections for 5m0s'
      grafana_panel_id: "100000"
      level: warning
      name: connections
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_connections",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_postgres_usage_connections_percentage
    labels:
      alert_type: builtin
      description: 'postgres: 80%+ connection in use for 5m0s'
      grafana_panel_id: "100001"
      level: warning
      name: usage_connections_percentage
      owner: infra-support
      service_name: postgres
    expr: max((sum by (job) (pg_stat_activity_count) / (sum by (job) (pg_settings_max_connections)
      - sum by (job) (pg_settings_superuser_reserved_connections)) * 100) >= 80)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 80%+ connection in use for 5m0s'
      grafana_panel_id: "100001"
      level: warning
      name: usage_connections_percentage
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_usage_connections_percentage",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_postgres_usage_connections_percentage
    labels:
      alert_type: builtin
      description: 'postgres: 100%+ connection in use for 5m0s'
      grafana_panel_id: "100001"
      level: critical
      name: usage_connections_percentage
      owner: infra-support
      service_name: postgres
    expr: max((sum by (job) (pg_stat_activity_count) / (sum by (job) (pg_settings_max_connections)
      - sum by (job) (pg_settings_superuser_reserved_connections)) * 100) >= 100)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 100%+ connection in use for 5m0s'
      grafana_panel_id: "100001"
      level: critical
      name: usage_connections_percentage
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="critical_postgres_usage_connections_percentage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_postgres_transaction_durations
    labels:
      alert_type: builtin
      description: 'postgres: 0.3s+ maximum transaction durations for 5m0s'
      grafana_panel_id: "100002"
      level: warning
      name: transaction_durations
      owner: infra-support
      service_name: postgres
    expr: max((sum by (job) (pg_stat_activity_max_tx_duration{datname!~"template.*|postgres|cloudsqladmin",job!="codeintel-db"})
      or sum by (job) (pg_stat_activity_max_tx_duration{datname!~"template.*|cloudsqladmin",job="codeinsights-db"}))
      >= 0.3)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 0.3s+ maximum transaction durations for 5m0s'
      grafana_panel_id: "100002"
      level: warning
      name: transaction_durations
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_transaction_durations",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_postgres_postgres_up
    labels:
      alert_type: builtin
      description: 'postgres: less than 0 database availability for 5m0s'
      grafana_panel_id: "100100"
      level: critical
      name: postgres_up
      owner: infra-support
      service_name: postgres
    expr: min((pg_up) <= 0)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: less than 0 database availability for 5m0s'
      grafana_panel_id: "100100"
      level: critical
      name: postgres_up
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="critical_postgres_postgres_up",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_postgres_invalid_indexes
    labels:
      alert_type: builtin
      description: 'postgres: 1+ invalid indexes (unusable by the query planner)'
      grafana_panel_id: "100101"
      level: critical
      name: invalid_indexes
      owner: infra-support
      service_name: postgres
    expr: sum((max by (relname) (pg_invalid_index_count)) >= 1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 1+ invalid indexes (unusable by the query planner)'
      grafana_panel_id: "100101"
      level: critical
      name: invalid_indexes
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="critical_postgres_invalid_indexes",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_postgres_pg_exporter_err
    labels:
      alert_type: builtin
      description: 'postgres: 1+ errors scraping postgres exporter for 5m0s'
      grafana_panel_id: "100110"
      level: warning
      name: pg_exporter_err
      owner: infra-support
      service_name: postgres
    expr: max((pg_exporter_last_scrape_error) >= 1)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 1+ errors scraping postgres exporter for 5m0s'
      grafana_panel_id: "100110"
      level: warning
      name: pg_exporter_err
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_pg_exporter_err",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_postgres_migration_in_progress
    labels:
      alert_type: builtin
      description: 'postgres: 1+ active schema migration for 5m0s'
      grafana_panel_id: "100111"
      level: critical
      name: migration_in_progress
      owner: infra-support
      service_name: postgres
    expr: max((pg_sg_migration_status) >= 1)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 1+ active schema migration for 5m0s'
      grafana_panel_id: "100111"
      level: critical
      name: migration_in_progress
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="critical_postgres_migration_in_progress",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_postgres_provisioning_container_cpu_usage_long_term
    labels:
      alert_type: builtin
      description: 'postgres: 80%+ container cpu usage total (90th percentile over
        1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "100300"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: infra-support
      service_name: postgres
    expr: max((quantile_over_time(0.9, cadvisor_container_cpu_usage_percentage_total{name=~"^(pgsql|codeintel-db|codeinsights).*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 80%+ container cpu usage total (90th percentile over
        1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "100300"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_provisioning_container_cpu_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_postgres_provisioning_container_memory_usage_long_term
    labels:
      alert_type: builtin
      description: 'postgres: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "100301"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: infra-support
      service_name: postgres
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^(pgsql|codeintel-db|codeinsights).*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "100301"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_provisioning_container_memory_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_postgres_provisioning_container_cpu_usage_short_term
    labels:
      alert_type: builtin
      description: 'postgres: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "100310"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: infra-support
      service_name: postgres
    expr: max((max_over_time(cadvisor_container_cpu_usage_percentage_total{name=~"^(pgsql|codeintel-db|codeinsights).*"}[5m]))
      >= 90)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "100310"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_provisioning_container_cpu_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_postgres_provisioning_container_memory_usage_short_term
    labels:
      alert_type: builtin
      description: 'postgres: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100311"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: infra-support
      service_name: postgres
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^(pgsql|codeintel-db|codeinsights).*"}[5m]))
      >= 90)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100311"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_provisioning_container_memory_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_postgres_container_oomkill_events_total
    labels:
      alert_type: builtin
      description: 'postgres: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100312"
      level: warning
      name: container_oomkill_events_total
      owner: infra-support
      service_name: postgres
    expr: max((max by (name) (container_oom_events_total{name=~"^(pgsql|codeintel-db|codeinsights).*"}))
      >= 1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100312"
      level: warning
      name: container_oomkill_events_total
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="warning_postgres_container_oomkill_events_total",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_postgres_pods_available_percentage
    labels:
      alert_type: builtin
      description: 'postgres: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100400"
      level: critical
      name: pods_available_percentage
      owner: infra-support
      service_name: postgres
    expr: min((sum by (app) (up{app=~".*(pgsql|codeintel-db|codeinsights)"}) / count
      by (app) (up{app=~".*(pgsql|codeintel-db|codeinsights)"}) * 100) <= 90)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'postgres: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100400"
      level: critical
      name: pods_available_percentage
      owner: infra-support
      service_name: postgres
    expr: max(ALERTS{alertname="critical_postgres_pods_available_percentage",alertstate="firing"}
      OR on() vector(0))
  interval: 30s
