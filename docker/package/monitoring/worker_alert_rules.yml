      grafana_panel_id: "101250"
      level: warning
      name: perms_syncer_outdated_perms
      owner: source
      service_name: worker
    expr: max((max by (type) (src_repo_perms_syncer_outdated_perms)) >= 100)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'worker: 100+ number of entities with outdated permissions for
