groups:
- name: embeddings
  rules:
  - alert: critical_embeddings_embeddings_site_configuration_duration_since_last_successful_update_by_instance
    labels:
      alert_type: builtin
      description: 'embeddings: 300s+ maximum duration since last successful site
        configuration update (all "embeddings" instances)'
      grafana_panel_id: "100001"
      level: critical
      name: embeddings_site_configuration_duration_since_last_successful_update_by_instance
      owner: infra-support
      service_name: embeddings
    expr: max((max(max_over_time(src_conf_client_time_since_last_successful_update_seconds{job=~".*embeddings"}[1m])))
      >= 300)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 300s+ maximum duration since last successful site
        configuration update (all "embeddings" instances)'
      grafana_panel_id: "100001"
      level: critical
      name: embeddings_site_configuration_duration_since_last_successful_update_by_instance
      owner: infra-support
      service_name: embeddings
    expr: max(ALERTS{alertname="critical_embeddings_embeddings_site_configuration_duration_since_last_successful_update_by_instance",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'embeddings: 0.1s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "100120"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: cody
      service_name: embeddings
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="embeddings"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="embeddings"}[5m])))
      >= 0.1)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 0.1s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "100120"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_mean_blocked_seconds_per_conn_request",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_embeddings_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'embeddings: 0.5s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "100120"
      level: critical
      name: mean_blocked_seconds_per_conn_request
      owner: cody
      service_name: embeddings
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="embeddings"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="embeddings"}[5m])))
      >= 0.5)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 0.5s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "100120"
      level: critical
      name: mean_blocked_seconds_per_conn_request
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="critical_embeddings_mean_blocked_seconds_per_conn_request",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_container_cpu_usage
    labels:
      alert_type: builtin
      description: 'embeddings: 99%+ container cpu usage total (1m average) across
        all cores by instance'
      grafana_panel_id: "100201"
      level: warning
      name: container_cpu_usage
      owner: cody
      service_name: embeddings
    expr: max((cadvisor_container_cpu_usage_percentage_total{name=~"^embeddings.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 99%+ container cpu usage total (1m average) across
        all cores by instance'
      grafana_panel_id: "100201"
      level: warning
      name: container_cpu_usage
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_container_cpu_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_container_memory_usage
    labels:
      alert_type: builtin
      description: 'embeddings: 99%+ container memory usage by instance'
      grafana_panel_id: "100202"
      level: warning
      name: container_memory_usage
      owner: cody
      service_name: embeddings
    expr: max((cadvisor_container_memory_usage_percentage_total{name=~"^embeddings.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 99%+ container memory usage by instance'
      grafana_panel_id: "100202"
      level: warning
      name: container_memory_usage
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_container_memory_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_provisioning_container_cpu_usage_long_term
    labels:
      alert_type: builtin
      description: 'embeddings: 80%+ container cpu usage total (90th percentile over
        1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "100300"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: cody
      service_name: embeddings
    expr: max((quantile_over_time(0.9, cadvisor_container_cpu_usage_percentage_total{name=~"^embeddings.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 80%+ container cpu usage total (90th percentile over
        1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "100300"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_provisioning_container_cpu_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_provisioning_container_memory_usage_long_term
    labels:
      alert_type: builtin
      description: 'embeddings: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "100301"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: cody
      service_name: embeddings
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^embeddings.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "100301"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_provisioning_container_memory_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_provisioning_container_cpu_usage_short_term
    labels:
      alert_type: builtin
      description: 'embeddings: 90%+ container cpu usage total (5m maximum) across
        all cores by instance for 30m0s'
      grafana_panel_id: "100310"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: cody
      service_name: embeddings
    expr: max((max_over_time(cadvisor_container_cpu_usage_percentage_total{name=~"^embeddings.*"}[5m]))
      >= 90)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 90%+ container cpu usage total (5m maximum) across
        all cores by instance for 30m0s'
      grafana_panel_id: "100310"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_provisioning_container_cpu_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_provisioning_container_memory_usage_short_term
    labels:
      alert_type: builtin
      description: 'embeddings: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100311"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: cody
      service_name: embeddings
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^embeddings.*"}[5m]))
      >= 90)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100311"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_provisioning_container_memory_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_container_oomkill_events_total
    labels:
      alert_type: builtin
      description: 'embeddings: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100312"
      level: warning
      name: container_oomkill_events_total
      owner: cody
      service_name: embeddings
    expr: max((max by (name) (container_oom_events_total{name=~"^embeddings.*"}))
      >= 1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100312"
      level: warning
      name: container_oomkill_events_total
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_container_oomkill_events_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_go_goroutines
    labels:
      alert_type: builtin
      description: 'embeddings: 10000+ maximum active goroutines for 10m0s'
      grafana_panel_id: "100400"
      level: warning
      name: go_goroutines
      owner: cody
      service_name: embeddings
    expr: max((max by (instance) (go_goroutines{job=~".*embeddings"})) >= 10000)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 10000+ maximum active goroutines for 10m0s'
      grafana_panel_id: "100400"
      level: warning
      name: go_goroutines
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_go_goroutines",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_embeddings_go_gc_duration_seconds
    labels:
      alert_type: builtin
      description: 'embeddings: 2s+ maximum go garbage collection duration'
      grafana_panel_id: "100401"
      level: warning
      name: go_gc_duration_seconds
      owner: cody
      service_name: embeddings
    expr: max((max by (instance) (go_gc_duration_seconds{job=~".*embeddings"})) >=
      2)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: 2s+ maximum go garbage collection duration'
      grafana_panel_id: "100401"
      level: warning
      name: go_gc_duration_seconds
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="warning_embeddings_go_gc_duration_seconds",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_embeddings_pods_available_percentage
    labels:
      alert_type: builtin
      description: 'embeddings: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100500"
      level: critical
      name: pods_available_percentage
      owner: cody
      service_name: embeddings
    expr: min((sum by (app) (up{app=~".*embeddings"}) / count by (app) (up{app=~".*embeddings"})
      * 100) <= 90)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'embeddings: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100500"
      level: critical
      name: pods_available_percentage
      owner: cody
      service_name: embeddings
    expr: max(ALERTS{alertname="critical_embeddings_pods_available_percentage",alertstate="firing"}
      OR on() vector(0))
  interval: 30s
