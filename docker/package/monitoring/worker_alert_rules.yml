groups:
- name: worker
  rules:
  - alert: warning_worker_worker_job_codeintel-upload-janitor_count
    labels:
      alert_type: builtin
      description: 'worker: less than 1 number of worker instances running the codeintel-upload-janitor
        job for 1m0s'
      grafana_panel_id: "100010"
      level: warning
      name: worker_job_codeintel-upload-janitor_count
      owner: code-intel
      service_name: worker
    expr: (min((sum(src_worker_jobs{job=~"^worker.*",job_name="codeintel-upload-janitor"}))
      < 1)) or (absent(sum(src_worker_jobs{job=~"^worker.*",job_name="codeintel-upload-janitor"}))
      == 1)
    for: 1m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'worker: less than 1 number of worker instances running the codeintel-upload-janitor
        job for 1m0s'
      grafana_panel_id: "100010"
      level: warning
      name: worker_job_codeintel-upload-janitor_count
      owner: code-intel
      service_name: worker
    expr: max(ALERTS{alertname="warning_worker_worker_job_codeintel-upload-janitor_count",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_worker_worker_job_codeintel-upload-janitor_count
    labels:
      alert_type: builtin
      description: 'worker: less than 1 number of worker instances running the codeintel-upload-janitor
        job for 5m0s'
      grafana_panel_id: "100010"
      level: critical
      name: worker_job_codeintel-upload-janitor_count
      owner: code-intel
      service_name: worker
    expr: (min((sum(src_worker_jobs{job=~"^worker.*",job_name="codeintel-upload-janitor"}))
      < 1)) or (absent(sum(src_worker_jobs{job=~"^worker.*",job_name="codeintel-upload-janitor"}))
      == 1)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
