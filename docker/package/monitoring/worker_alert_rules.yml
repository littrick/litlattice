    expr: max(ALERTS{alertname="warning_worker_perms_syncer_sync_duration",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_worker_perms_syncer_sync_errors
    labels:
      alert_type: builtin
      description: 'worker: 1+ permissions sync error rate for 1m0s'
      grafana_panel_id: "101270"
      level: critical
      name: perms_syncer_sync_errors
      owner: source
      service_name: worker
    expr: max((max by (type) (ceil(rate(src_repo_perms_syncer_sync_errors_total[1m]))))
      >= 1)
