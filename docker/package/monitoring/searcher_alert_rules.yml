groups:
- name: searcher
  rules:
  - alert: warning_searcher_replica_traffic
    labels:
      alert_type: builtin
      description: 'searcher: 5+ requests per second per replica over 10m'
      grafana_panel_id: "100001"
      level: warning
      name: replica_traffic
      owner: search-platform
      service_name: searcher
    expr: max((sum by (instance) (rate(searcher_service_request_total[10m]))) >= 5)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 5+ requests per second per replica over 10m'
      grafana_panel_id: "100001"
      level: warning
      name: replica_traffic
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_replica_traffic",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_unindexed_search_request_errors
    labels:
      alert_type: builtin
      description: 'searcher: 5%+ unindexed search request errors every 5m by code
        for 5m0s'
      grafana_panel_id: "100011"
      level: warning
      name: unindexed_search_request_errors
      owner: search-platform
      service_name: searcher
    expr: max((sum by (code) (increase(searcher_service_request_total{code!="200",code!="canceled"}[5m]))
      / ignoring (code) group_left () sum(increase(searcher_service_request_total[5m]))
      * 100) >= 5)
    for: 5m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 5%+ unindexed search request errors every 5m by code
        for 5m0s'
      grafana_panel_id: "100011"
      level: warning
      name: unindexed_search_request_errors
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_unindexed_search_request_errors",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_searcher_searcher_site_configuration_duration_since_last_successful_update_by_instance
    labels:
      alert_type: builtin
      description: 'searcher: 300s+ maximum duration since last successful site configuration
        update (all "searcher" instances)'
      grafana_panel_id: "100701"
      level: critical
      name: searcher_site_configuration_duration_since_last_successful_update_by_instance
      owner: infra-support
      service_name: searcher
    expr: max((max(max_over_time(src_conf_client_time_since_last_successful_update_seconds{job=~".*searcher"}[1m])))
      >= 300)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 300s+ maximum duration since last successful site configuration
        update (all "searcher" instances)'
      grafana_panel_id: "100701"
      level: critical
      name: searcher_site_configuration_duration_since_last_successful_update_by_instance
      owner: infra-support
      service_name: searcher
    expr: max(ALERTS{alertname="critical_searcher_searcher_site_configuration_duration_since_last_successful_update_by_instance",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'searcher: 0.1s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "100820"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: searcher
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="searcher"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="searcher"}[5m])))
      >= 0.1)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 0.1s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "100820"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_mean_blocked_seconds_per_conn_request",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_searcher_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'searcher: 0.5s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "100820"
      level: critical
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: searcher
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="searcher"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="searcher"}[5m])))
      >= 0.5)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 0.5s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "100820"
      level: critical
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: searcher
    expr: max(ALERTS{alertname="critical_searcher_mean_blocked_seconds_per_conn_request",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_container_cpu_usage
    labels:
      alert_type: builtin
      description: 'searcher: 99%+ container cpu usage total (1m average) across all
        cores by instance'
      grafana_panel_id: "100901"
      level: warning
      name: container_cpu_usage
      owner: search-platform
      service_name: searcher
    expr: max((cadvisor_container_cpu_usage_percentage_total{name=~"^searcher.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 99%+ container cpu usage total (1m average) across all
        cores by instance'
      grafana_panel_id: "100901"
      level: warning
      name: container_cpu_usage
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_container_cpu_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_container_memory_usage
    labels:
      alert_type: builtin
      description: 'searcher: 99%+ container memory usage by instance'
      grafana_panel_id: "100902"
      level: warning
      name: container_memory_usage
      owner: search-platform
      service_name: searcher
    expr: max((cadvisor_container_memory_usage_percentage_total{name=~"^searcher.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 99%+ container memory usage by instance'
      grafana_panel_id: "100902"
      level: warning
      name: container_memory_usage
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_container_memory_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_provisioning_container_cpu_usage_long_term
    labels:
      alert_type: builtin
      description: 'searcher: 80%+ container cpu usage total (90th percentile over
        1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "101000"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: search-platform
      service_name: searcher
    expr: max((quantile_over_time(0.9, cadvisor_container_cpu_usage_percentage_total{name=~"^searcher.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 80%+ container cpu usage total (90th percentile over
        1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "101000"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_provisioning_container_cpu_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_provisioning_container_memory_usage_long_term
    labels:
      alert_type: builtin
      description: 'searcher: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "101001"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: search-platform
      service_name: searcher
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^searcher.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "101001"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_provisioning_container_memory_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_provisioning_container_cpu_usage_short_term
    labels:
      alert_type: builtin
      description: 'searcher: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "101010"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: search-platform
      service_name: searcher
    expr: max((max_over_time(cadvisor_container_cpu_usage_percentage_total{name=~"^searcher.*"}[5m]))
      >= 90)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "101010"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_provisioning_container_cpu_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_provisioning_container_memory_usage_short_term
    labels:
      alert_type: builtin
      description: 'searcher: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "101011"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: search-platform
      service_name: searcher
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^searcher.*"}[5m]))
      >= 90)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "101011"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_provisioning_container_memory_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_container_oomkill_events_total
    labels:
      alert_type: builtin
      description: 'searcher: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "101012"
      level: warning
      name: container_oomkill_events_total
      owner: search-platform
      service_name: searcher
    expr: max((max by (name) (container_oom_events_total{name=~"^searcher.*"})) >=
      1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "101012"
      level: warning
      name: container_oomkill_events_total
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_container_oomkill_events_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_go_goroutines
    labels:
      alert_type: builtin
      description: 'searcher: 10000+ maximum active goroutines for 10m0s'
      grafana_panel_id: "101100"
      level: warning
      name: go_goroutines
      owner: search-platform
      service_name: searcher
    expr: max((max by (instance) (go_goroutines{job=~".*searcher"})) >= 10000)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 10000+ maximum active goroutines for 10m0s'
      grafana_panel_id: "101100"
      level: warning
      name: go_goroutines
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_go_goroutines",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_searcher_go_gc_duration_seconds
    labels:
      alert_type: builtin
      description: 'searcher: 2s+ maximum go garbage collection duration'
      grafana_panel_id: "101101"
      level: warning
      name: go_gc_duration_seconds
      owner: search-platform
      service_name: searcher
    expr: max((max by (instance) (go_gc_duration_seconds{job=~".*searcher"})) >= 2)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: 2s+ maximum go garbage collection duration'
      grafana_panel_id: "101101"
      level: warning
      name: go_gc_duration_seconds
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="warning_searcher_go_gc_duration_seconds",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_searcher_pods_available_percentage
    labels:
      alert_type: builtin
      description: 'searcher: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "101200"
      level: critical
      name: pods_available_percentage
      owner: search-platform
      service_name: searcher
    expr: min((sum by (app) (up{app=~".*searcher"}) / count by (app) (up{app=~".*searcher"})
      * 100) <= 90)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'searcher: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "101200"
      level: critical
      name: pods_available_percentage
      owner: search-platform
      service_name: searcher
    expr: max(ALERTS{alertname="critical_searcher_pods_available_percentage",alertstate="firing"}
      OR on() vector(0))
  interval: 30s
