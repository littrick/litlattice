groups:
- name: syntect-server
  rules:
  - alert: warning_syntect-server_container_cpu_usage
    labels:
      alert_type: builtin
      description: 'syntect-server: 99%+ container cpu usage total (1m average) across
        all cores by instance'
      grafana_panel_id: "100101"
      level: warning
      name: container_cpu_usage
      owner: infra-support
      service_name: syntect-server
    expr: max((cadvisor_container_cpu_usage_percentage_total{name=~"^syntect-server.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'syntect-server: 99%+ container cpu usage total (1m average) across
        all cores by instance'
      grafana_panel_id: "100101"
      level: warning
      name: container_cpu_usage
      owner: infra-support
      service_name: syntect-server
    expr: max(ALERTS{alertname="warning_syntect-server_container_cpu_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_syntect-server_container_memory_usage
    labels:
      alert_type: builtin
      description: 'syntect-server: 99%+ container memory usage by instance'
      grafana_panel_id: "100102"
      level: warning
      name: container_memory_usage
      owner: infra-support
      service_name: syntect-server
    expr: max((cadvisor_container_memory_usage_percentage_total{name=~"^syntect-server.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'syntect-server: 99%+ container memory usage by instance'
      grafana_panel_id: "100102"
      level: warning
      name: container_memory_usage
      owner: infra-support
      service_name: syntect-server
    expr: max(ALERTS{alertname="warning_syntect-server_container_memory_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_syntect-server_provisioning_container_cpu_usage_long_term
    labels:
      alert_type: builtin
      description: 'syntect-server: 80%+ container cpu usage total (90th percentile
        over 1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "100200"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: infra-support
      service_name: syntect-server
    expr: max((quantile_over_time(0.9, cadvisor_container_cpu_usage_percentage_total{name=~"^syntect-server.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'syntect-server: 80%+ container cpu usage total (90th percentile
        over 1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "100200"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: infra-support
      service_name: syntect-server
    expr: max(ALERTS{alertname="warning_syntect-server_provisioning_container_cpu_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_syntect-server_provisioning_container_memory_usage_long_term
    labels:
      alert_type: builtin
      description: 'syntect-server: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "100201"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: infra-support
      service_name: syntect-server
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^syntect-server.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'syntect-server: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "100201"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: infra-support
      service_name: syntect-server
    expr: max(ALERTS{alertname="warning_syntect-server_provisioning_container_memory_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_syntect-server_provisioning_container_cpu_usage_short_term
    labels:
      alert_type: builtin
      description: 'syntect-server: 90%+ container cpu usage total (5m maximum) across
        all cores by instance for 30m0s'
      grafana_panel_id: "100210"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: infra-support
      service_name: syntect-server
    expr: max((max_over_time(cadvisor_container_cpu_usage_percentage_total{name=~"^syntect-server.*"}[5m]))
      >= 90)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'syntect-server: 90%+ container cpu usage total (5m maximum) across
        all cores by instance for 30m0s'
      grafana_panel_id: "100210"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: infra-support
      service_name: syntect-server
    expr: max(ALERTS{alertname="warning_syntect-server_provisioning_container_cpu_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_syntect-server_provisioning_container_memory_usage_short_term
    labels:
      alert_type: builtin
      description: 'syntect-server: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100211"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: infra-support
      service_name: syntect-server
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^syntect-server.*"}[5m]))
      >= 90)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'syntect-server: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100211"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: infra-support
      service_name: syntect-server
    expr: max(ALERTS{alertname="warning_syntect-server_provisioning_container_memory_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_syntect-server_container_oomkill_events_total
    labels:
      alert_type: builtin
      description: 'syntect-server: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100212"
      level: warning
      name: container_oomkill_events_total
      owner: infra-support
      service_name: syntect-server
    expr: max((max by (name) (container_oom_events_total{name=~"^syntect-server.*"}))
      >= 1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'syntect-server: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100212"
      level: warning
      name: container_oomkill_events_total
      owner: infra-support
      service_name: syntect-server
    expr: max(ALERTS{alertname="warning_syntect-server_container_oomkill_events_total",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_syntect-server_pods_available_percentage
    labels:
      alert_type: builtin
      description: 'syntect-server: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100300"
      level: critical
      name: pods_available_percentage
      owner: infra-support
      service_name: syntect-server
    expr: min((sum by (app) (up{app=~".*syntect-server"}) / count by (app) (up{app=~".*syntect-server"})
      * 100) <= 90)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'syntect-server: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100300"
      level: critical
      name: pods_available_percentage
      owner: infra-support
      service_name: syntect-server
    expr: max(ALERTS{alertname="critical_syntect-server_pods_available_percentage",alertstate="firing"}
      OR on() vector(0))
  interval: 30s
