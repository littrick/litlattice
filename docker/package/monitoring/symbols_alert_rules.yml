groups:
- name: symbols
  rules:
  - alert: critical_symbols_symbols_site_configuration_duration_since_last_successful_update_by_instance
    labels:
      alert_type: builtin
      description: 'symbols: 300s+ maximum duration since last successful site configuration
        update (all "symbols" instances)'
      grafana_panel_id: "100901"
      level: critical
      name: symbols_site_configuration_duration_since_last_successful_update_by_instance
      owner: infra-support
      service_name: symbols
    expr: max((max(max_over_time(src_conf_client_time_since_last_successful_update_seconds{job=~".*symbols"}[1m])))
      >= 300)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 300s+ maximum duration since last successful site configuration
        update (all "symbols" instances)'
      grafana_panel_id: "100901"
      level: critical
      name: symbols_site_configuration_duration_since_last_successful_update_by_instance
      owner: infra-support
      service_name: symbols
    expr: max(ALERTS{alertname="critical_symbols_symbols_site_configuration_duration_since_last_successful_update_by_instance",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'symbols: 0.1s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "101020"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: symbols
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="symbols"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="symbols"}[5m])))
      >= 0.1)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 0.1s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "101020"
      level: warning
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_mean_blocked_seconds_per_conn_request",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_symbols_mean_blocked_seconds_per_conn_request
    labels:
      alert_type: builtin
      description: 'symbols: 0.5s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "101020"
      level: critical
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: symbols
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="symbols"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="symbols"}[5m])))
      >= 0.5)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 0.5s+ mean blocked seconds per conn request for 10m0s'
      grafana_panel_id: "101020"
      level: critical
      name: mean_blocked_seconds_per_conn_request
      owner: infra-support
      service_name: symbols
    expr: max(ALERTS{alertname="critical_symbols_mean_blocked_seconds_per_conn_request",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_container_cpu_usage
    labels:
      alert_type: builtin
      description: 'symbols: 99%+ container cpu usage total (1m average) across all
        cores by instance'
      grafana_panel_id: "101101"
      level: warning
      name: container_cpu_usage
      owner: code-intel
      service_name: symbols
    expr: max((cadvisor_container_cpu_usage_percentage_total{name=~"^symbols.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 99%+ container cpu usage total (1m average) across all
        cores by instance'
      grafana_panel_id: "101101"
      level: warning
      name: container_cpu_usage
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_container_cpu_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_container_memory_usage
    labels:
      alert_type: builtin
      description: 'symbols: 99%+ container memory usage by instance'
      grafana_panel_id: "101102"
      level: warning
      name: container_memory_usage
      owner: code-intel
      service_name: symbols
    expr: max((cadvisor_container_memory_usage_percentage_total{name=~"^symbols.*"})
      >= 99)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 99%+ container memory usage by instance'
      grafana_panel_id: "101102"
      level: warning
      name: container_memory_usage
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_container_memory_usage",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_provisioning_container_cpu_usage_long_term
    labels:
      alert_type: builtin
      description: 'symbols: 80%+ container cpu usage total (90th percentile over
        1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "101200"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: code-intel
      service_name: symbols
    expr: max((quantile_over_time(0.9, cadvisor_container_cpu_usage_percentage_total{name=~"^symbols.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 80%+ container cpu usage total (90th percentile over
        1d) across all cores by instance for 336h0m0s'
      grafana_panel_id: "101200"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_provisioning_container_cpu_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_provisioning_container_memory_usage_long_term
    labels:
      alert_type: builtin
      description: 'symbols: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "101201"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: code-intel
      service_name: symbols
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^symbols.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 80%+ container memory usage (1d maximum) by instance
        for 336h0m0s'
      grafana_panel_id: "101201"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_provisioning_container_memory_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_provisioning_container_cpu_usage_short_term
    labels:
      alert_type: builtin
      description: 'symbols: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "101210"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: code-intel
      service_name: symbols
    expr: max((max_over_time(cadvisor_container_cpu_usage_percentage_total{name=~"^symbols.*"}[5m]))
      >= 90)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "101210"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_provisioning_container_cpu_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_provisioning_container_memory_usage_short_term
    labels:
      alert_type: builtin
      description: 'symbols: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "101211"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: code-intel
      service_name: symbols
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^symbols.*"}[5m]))
      >= 90)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "101211"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_provisioning_container_memory_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_container_oomkill_events_total
    labels:
      alert_type: builtin
      description: 'symbols: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "101212"
      level: warning
      name: container_oomkill_events_total
      owner: code-intel
      service_name: symbols
    expr: max((max by (name) (container_oom_events_total{name=~"^symbols.*"})) >=
      1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "101212"
      level: warning
      name: container_oomkill_events_total
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_container_oomkill_events_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_go_goroutines
    labels:
      alert_type: builtin
      description: 'symbols: 10000+ maximum active goroutines for 10m0s'
      grafana_panel_id: "101300"
      level: warning
      name: go_goroutines
      owner: code-intel
      service_name: symbols
    expr: max((max by (instance) (go_goroutines{job=~".*symbols"})) >= 10000)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 10000+ maximum active goroutines for 10m0s'
      grafana_panel_id: "101300"
      level: warning
      name: go_goroutines
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_go_goroutines",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_symbols_go_gc_duration_seconds
    labels:
      alert_type: builtin
      description: 'symbols: 2s+ maximum go garbage collection duration'
      grafana_panel_id: "101301"
      level: warning
      name: go_gc_duration_seconds
      owner: code-intel
      service_name: symbols
    expr: max((max by (instance) (go_gc_duration_seconds{job=~".*symbols"})) >= 2)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: 2s+ maximum go garbage collection duration'
      grafana_panel_id: "101301"
      level: warning
      name: go_gc_duration_seconds
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="warning_symbols_go_gc_duration_seconds",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_symbols_pods_available_percentage
    labels:
      alert_type: builtin
      description: 'symbols: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "101400"
      level: critical
      name: pods_available_percentage
      owner: code-intel
      service_name: symbols
    expr: min((sum by (app) (up{app=~".*symbols"}) / count by (app) (up{app=~".*symbols"})
      * 100) <= 90)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'symbols: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "101400"
      level: critical
      name: pods_available_percentage
      owner: code-intel
      service_name: symbols
    expr: max(ALERTS{alertname="critical_symbols_pods_available_percentage",alertstate="firing"}
      OR on() vector(0))
  interval: 30s
