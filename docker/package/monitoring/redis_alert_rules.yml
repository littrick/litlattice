groups:
- name: redis
  rules:
  - alert: critical_redis_redis-store_up
    labels:
      alert_type: builtin
      description: 'redis: less than 1 redis-store availability for 10s'
      grafana_panel_id: "100000"
      level: critical
      name: redis-store_up
      owner: infra-support
      service_name: redis
    expr: min((redis_up{app="redis-store"}) < 1)
    for: 10s
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: less than 1 redis-store availability for 10s'
      grafana_panel_id: "100000"
      level: critical
      name: redis-store_up
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="critical_redis_redis-store_up",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_redis_redis-cache_up
    labels:
      alert_type: builtin
      description: 'redis: less than 1 redis-cache availability for 10s'
      grafana_panel_id: "100100"
      level: critical
      name: redis-cache_up
      owner: infra-support
      service_name: redis
    expr: min((redis_up{app="redis-cache"}) < 1)
    for: 10s
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: less than 1 redis-cache availability for 10s'
      grafana_panel_id: "100100"
      level: critical
      name: redis-cache_up
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="critical_redis_redis-cache_up",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_provisioning_container_cpu_usage_long_term
    labels:
      alert_type: builtin
      description: 'redis: 80%+ container cpu usage total (90th percentile over 1d)
        across all cores by instance for 336h0m0s'
      grafana_panel_id: "100200"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: infra-support
      service_name: redis
    expr: max((quantile_over_time(0.9, cadvisor_container_cpu_usage_percentage_total{name=~"^redis-cache.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 80%+ container cpu usage total (90th percentile over 1d)
        across all cores by instance for 336h0m0s'
      grafana_panel_id: "100200"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_provisioning_container_cpu_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_provisioning_container_memory_usage_long_term
    labels:
      alert_type: builtin
      description: 'redis: 80%+ container memory usage (1d maximum) by instance for
        336h0m0s'
      grafana_panel_id: "100201"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: infra-support
      service_name: redis
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^redis-cache.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 80%+ container memory usage (1d maximum) by instance for
        336h0m0s'
      grafana_panel_id: "100201"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_provisioning_container_memory_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_provisioning_container_cpu_usage_short_term
    labels:
      alert_type: builtin
      description: 'redis: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "100210"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: infra-support
      service_name: redis
    expr: max((max_over_time(cadvisor_container_cpu_usage_percentage_total{name=~"^redis-cache.*"}[5m]))
      >= 90)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "100210"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_provisioning_container_cpu_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_provisioning_container_memory_usage_short_term
    labels:
      alert_type: builtin
      description: 'redis: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100211"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: infra-support
      service_name: redis
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^redis-cache.*"}[5m]))
      >= 90)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100211"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_provisioning_container_memory_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_container_oomkill_events_total
    labels:
      alert_type: builtin
      description: 'redis: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100212"
      level: warning
      name: container_oomkill_events_total
      owner: infra-support
      service_name: redis
    expr: max((max by (name) (container_oom_events_total{name=~"^redis-cache.*"}))
      >= 1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100212"
      level: warning
      name: container_oomkill_events_total
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_container_oomkill_events_total",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_provisioning_container_cpu_usage_long_term
    labels:
      alert_type: builtin
      description: 'redis: 80%+ container cpu usage total (90th percentile over 1d)
        across all cores by instance for 336h0m0s'
      grafana_panel_id: "100300"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: infra-support
      service_name: redis
    expr: max((quantile_over_time(0.9, cadvisor_container_cpu_usage_percentage_total{name=~"^redis-store.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 80%+ container cpu usage total (90th percentile over 1d)
        across all cores by instance for 336h0m0s'
      grafana_panel_id: "100300"
      level: warning
      name: provisioning_container_cpu_usage_long_term
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_provisioning_container_cpu_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_provisioning_container_memory_usage_long_term
    labels:
      alert_type: builtin
      description: 'redis: 80%+ container memory usage (1d maximum) by instance for
        336h0m0s'
      grafana_panel_id: "100301"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: infra-support
      service_name: redis
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^redis-store.*"}[1d]))
      >= 80)
    for: 2w
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 80%+ container memory usage (1d maximum) by instance for
        336h0m0s'
      grafana_panel_id: "100301"
      level: warning
      name: provisioning_container_memory_usage_long_term
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_provisioning_container_memory_usage_long_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_provisioning_container_cpu_usage_short_term
    labels:
      alert_type: builtin
      description: 'redis: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "100310"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: infra-support
      service_name: redis
    expr: max((max_over_time(cadvisor_container_cpu_usage_percentage_total{name=~"^redis-store.*"}[5m]))
      >= 90)
    for: 30m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 90%+ container cpu usage total (5m maximum) across all
        cores by instance for 30m0s'
      grafana_panel_id: "100310"
      level: warning
      name: provisioning_container_cpu_usage_short_term
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_provisioning_container_cpu_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_provisioning_container_memory_usage_short_term
    labels:
      alert_type: builtin
      description: 'redis: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100311"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: infra-support
      service_name: redis
    expr: max((max_over_time(cadvisor_container_memory_usage_percentage_total{name=~"^redis-store.*"}[5m]))
      >= 90)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 90%+ container memory usage (5m maximum) by instance'
      grafana_panel_id: "100311"
      level: warning
      name: provisioning_container_memory_usage_short_term
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_provisioning_container_memory_usage_short_term",alertstate="firing"}
      OR on() vector(0))
  - alert: warning_redis_container_oomkill_events_total
    labels:
      alert_type: builtin
      description: 'redis: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100312"
      level: warning
      name: container_oomkill_events_total
      owner: infra-support
      service_name: redis
    expr: max((max by (name) (container_oom_events_total{name=~"^redis-store.*"}))
      >= 1)
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: 1+ container OOMKILL events total by instance'
      grafana_panel_id: "100312"
      level: warning
      name: container_oomkill_events_total
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="warning_redis_container_oomkill_events_total",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_redis_pods_available_percentage
    labels:
      alert_type: builtin
      description: 'redis: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100400"
      level: critical
      name: pods_available_percentage
      owner: infra-support
      service_name: redis
    expr: min((sum by (app) (up{app=~".*redis-cache"}) / count by (app) (up{app=~".*redis-cache"})
      * 100) <= 90)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100400"
      level: critical
      name: pods_available_percentage
      owner: infra-support
      service_name: redis
    expr: max(ALERTS{alertname="critical_redis_pods_available_percentage",alertstate="firing"}
      OR on() vector(0))
  - alert: critical_redis_pods_available_percentage
    labels:
      alert_type: builtin
      description: 'redis: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100500"
      level: critical
      name: pods_available_percentage
      owner: infra-support
      service_name: redis
    expr: min((sum by (app) (up{app=~".*redis-store"}) / count by (app) (up{app=~".*redis-store"})
      * 100) <= 90)
    for: 10m
  - record: alert_count
    labels:
      alert_type: builtin
      description: 'redis: less than 90% percentage pods available for 10m0s'
      grafana_panel_id: "100500"
      level: critical
      name: pods_available_percentage
