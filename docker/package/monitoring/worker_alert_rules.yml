      service_name: worker
    expr: max((sum by (app_name, db_name) (increase(src_pgsql_conns_blocked_seconds{app_name="worker"}[5m]))
      / sum by (app_name, db_name) (increase(src_pgsql_conns_waited_for{app_name="worker"}[5m])))
      >= 0.1)
